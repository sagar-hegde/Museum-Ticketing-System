<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Mode Selection</title>
    <style>
        /* Inline CSS */
        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(110deg, #cd81e4, #eabf97);        
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 600px; /* Increased width to accommodate side-by-side boxes */
            text-align: center; /* Center text inside the container */
        }

        h1 {
            margin: 20px;
        }

        .payment-options {
            display: flex;
            justify-content: space-between; /* Space between boxes */
        }

        .payment-option-box {
            border: 2px solid darkslateblue;
            padding: 10px;
            border-radius: 30px;
            flex: 1; /* Allow boxes to grow equally */
            margin-right: 20px; /* Space between boxes */
            cursor: pointer; /* Change cursor to pointer to indicate clickable */
            text-align: center; /* Center text inside the box */
            font-size: 25px;
            transition: all 0.3s ease;
        }

        .payment-option-box.online {
            background: lightpink; /* Light blue for online */
        }

        .payment-option-box.offline {
            background: lightskyblue; /* Light red for offline */
        }

        .payment-option-box.selected {
            background-color: #119a01;
            transform: scale(1.05); /* Adjust scaling */
        }

        .payment-option-box.popout {
            animation: popup 0.3s ease-in-out;
        }

        @keyframes popOut {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Modal Popup Styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: lightgreen; 
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease-in;
        }

        .modal-content {
            background: white;
            margin: auto; /* Center the modal content horizontally */
            padding: 20px;
            border-radius: 20px;
            width: 50%; /* Could be more or less, depending on screen size */
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .modal-content .checkmark-container {
            display: inline-block;
            margin-bottom: 10px;
        }

        .modal-content .checkmark {
            width: 80px;
            height: 80px;
            display: inline-block;
        }

        .checkmark path {
            stroke: #4caf50;
            stroke-width: 8;
            fill: none;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw 0.5s ease-in-out forwards;
        }

        @keyframes draw {
            from {
                stroke-dashoffset: 100;
            }
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content .message {
            font-size: 24px;
            color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mode of Payment</h1>
        <div class="payment-options">
            <div class="payment-option-box offline" data-value="offline">
                Offline
            </div>
            <div class="payment-option-box online" data-value="online">
                Online
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="successModal" class="modal" role="dialog" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-content">
            <div class="checkmark-container">
                <svg class="checkmark" viewBox="0 0 50 50">
                    <path d="M12 25 l10 10 l20 -20"></path>
                </svg>
            </div>
            <div class="message" id="modalTitle">Payment Successful</div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.payment-option-box').forEach(box => {
            box.addEventListener('click', function() {
                // Remove 'selected' and 'popout' classes from all boxes
                document.querySelectorAll('.payment-option-box').forEach(b => {
                    b.classList.remove('selected');
                    b.classList.remove('popout');
                });

                // Add 'selected' class to the clicked box
                this.classList.add('selected');

                // Get the value of the selected option
                const selectedValue = this.getAttribute('data-value');

                // Check if the selected option is 'offline'
                if (selectedValue === 'offline') {
                    // Show the modal
                    const modal = document.getElementById('successModal');
                    modal.style.display = 'flex';

                    // Redirect to 'ticket.html' after a short delay
                    setTimeout(() => {
                        window.location.href = 'ticket.html';
                    }, 1000); // Delay for 1 second (1000 milliseconds)
                } else if (selectedValue === 'online') {
                    // Add 'popout' class to create popout effect
                    this.classList.add('popout');

                    // Redirect to 'online.html' immediately
                    setTimeout(() => {
                        window.location.href = 'online.html';
                    }, 200); // Delay for the animation to complete
                }
            });
        });

        // Get the modal
        const modal = document.getElementById('successModal');

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>    
</body>
</html>
